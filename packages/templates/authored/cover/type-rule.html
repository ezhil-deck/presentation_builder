<!doctype html>
<html lang="la">
  <head>
    <meta charset="utf-8" />
    <title>Cover: type only on a colour field, a rule under the title</title>
    <style>
      html,
      body {
        margin: 0;
        background: #ffffff;
      }
      .slide {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f0f0f0;
        color: #2b2b2b;
        font-family: Arial, Helvetica, sans-serif;
      }
      .slide > * {
        position: absolute;
        margin: 0;
      }
      .k {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .t {
        font-weight: 700;
        line-height: 1.05;
      }
      .lg {
        width: 208px;
        height: 52px;
        background: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPAAAAA8CAYAAABYfzddAAAAqElEQVR42u3dQQqAIBBAURVPOQeca+pWaCmE2XsnsOSji4ZKAQAAAAAAAAAAYE+NiHH6IjOz2ip4al4BCBgQMCBgEDAgYEDAgIBBwICAAQHDf/XbHugL33bDjnU2wAkMrtCAgAEBg4ABAQMCBgQMAgYEDAgYBAwIGBAwIGAQMHCu6wb6/QgNJzAgYEDAgIBBwICAAQGDgAEBAwIGBAwAAAAAAAAAAPCeCYTOCkmo3g3iAAAAAElFTkSuQmCC)
          left center/contain no-repeat;
      }
      .lg.large {
        width: 420px;
        height: 105px;
      }
      .inner {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div
      class="slide"
      data-template="cover-type-rule"
      data-category="cover-slide"
      data-basis="Cover ranges (anatomy decisions: no photo -> a type-only cover with a larger title; F2 / F3 / F8): title 104 px = 9.6 % H (inside the cover p10-p90 4.44-11.1), a keyword set heavier in the title (weight contrast, not colour), title : subtitle 2.3, 2 sizes plus the label (statement slides 1-3 sizes), 48 px = 4.4 % H gaps, left margin 80 px = 4.2 % W, the group in the middle band (visual weight 44-55 % H)."
    >
      <div
        data-role="background"
        data-need="colour-field:dark"
        style="left: 0; top: 0; width: 1920px; height: 1080px; background: #2f2f2f"
      ></div>
      <div class="k" style="left: 80px; top: 300px; width: 1300px; color: #bdbdbd">Ultricies vitae</div>
      <div
        class="t"
        data-need="weight-contrast"
        data-need-optional
        style="left: 80px; top: 352px; width: 1300px; font-size: 104px; font-weight: 300; color: #f2f2f2"
      >
        Nunc <b style="font-weight: 800">dolor sit</b> amet elit
      </div>
      <div
        data-role="rule"
        data-need="device:rule"
        data-need-optional
        style="left: 80px; top: 494px; width: 160px; height: 6px; background: #bdbdbd"
      ></div>
      <p
        data-role="subtitle"
        style="left: 80px; top: 528px; width: 1100px; font-size: 45px; line-height: 1.3; color: #d6d6d6"
      >
        Sed do eiusmod tempor incididunt
      </p>
      <span class="lg" data-role="brand-logo" style="left: 80px; top: 932px"></span>
    </div>
  </body>
</html>
