<!doctype html>

    <style>

        position: absolute;
        margin: 0;
      }
      .k {

        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .t {
        font-weight: 700;
        line-height: 1.05;

        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div

      data-category="cta-slide"
      data-basis="Closing ranges (anatomy F7): the big logo returns on the closing (here 105 px tall, 1.5 x the title size, inside the 0.22-1.6 logo : title range), title 64 px = 5.9 % H (between the closing 3.86 and the statement 5.9-6.7), contact lines as a dense group (closing inner gap ~1.5 % H), left margin 80 px, on a colour field."
    >
      <div
        data-role="background"
        data-need="colour-field:any"
        style="left: 0; top: 0; width: 1920px; height: 1080px; background: #3a3a3a"
      ></div>
      <span
        class="lg large"
        data-role="brand-logo"
        data-need="logo:full"

        hello@example.com · www.example.com
