<!doctype html>
<html lang="la">
  <head>
    <meta charset="utf-8" />
    <title>Statement (base and dark option)</title>
    <style>
      html,
      body {
        margin: 0;
        background: #ffffff;
      }
      .slide {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f0f0f0;
        color: #2b2b2b;
        font-family: Arial, Helvetica, sans-serif;
      }
      .slide > * {
        position: absolute;
        margin: 0;
      }
      .k {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #5f5f5f;
      }
      .t {
        font-weight: 700;
        line-height: 1.05;
      }
      .lg {
        width: 240px;
        height: 60px;
        background: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPAAAAA8CAYAAABYfzddAAAAqElEQVR42u3dQQqAIBBAURVPOQeca+pWaCmE2XsnsOSji4ZKAQAAAAAAAAAAYE+NiHH6IjOz2ip4al4BCBgQMCBgEDAgYEDAgIBBwICAAQHDf/XbHugL33bDjnU2wAkMrtCAgAEBg4ABAQMCBgQMAgYEDAgYBAwIGBAwIGAQMHCu6wb6/QgNJzAgYEDAgIBBwICAAQGDgAEBAwIGBAwAAAAAAAAAAPCeCYTOCkmo3g3iAAAAAElFTkSuQmCC)
          left center/contain no-repeat;
      }
      .dark {
        background: #2b2b2b;
        color: #ededed;
      }
    </style>
  </head>
  <body>
    <div class="slide" data-template="statement-quote">
      <p
        data-role="title"
        data-need="weight-contrast"
        style="left: 240px; top: 300px; width: 1440px; font-size: 72px; line-height: 1.2; font-weight: 400"
      >
        “Vivamus <b>magna justo</b>, lacinia eget consectetur sed, convallis at tellus.”
      </p>
      <p
        data-role="attribution"
        data-need="second-face"
        data-need-optional
        style="
          left: 240px;
          top: 500px;
          font-size: 32px;
          font-family: Georgia, serif;
          font-style: italic;
          color: #5a5a5a;
        "
      >
        Nomen Cognomen, auctor
      </p>
      <span class="lg" style="left: 240px; top: 960px"></span>
    </div>
    <div class="slide dark" data-template="statement-quote" data-option="dark">
      <p
        data-role="title"
        data-need="weight-contrast"
        style="left: 240px; top: 300px; width: 1440px; font-size: 72px; line-height: 1.2; font-weight: 400"
      >
        “Vivamus <b>magna justo</b>, lacinia eget consectetur sed, convallis at tellus.”
      </p>
      <p
        data-role="attribution"
        data-need="second-face"
        data-need-optional
        style="
          left: 240px;
          top: 500px;
          font-size: 32px;
          font-family: Georgia, serif;
          font-style: italic;
          color: #bdbdbd;
        "
      >
        Nomen Cognomen, auctor
      </p>
      <span class="lg" style="left: 240px; top: 960px"></span>
    </div>
  </body>
</html>
