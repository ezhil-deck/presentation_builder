<!doctype html>
<html lang="la">
  <head>
    <meta charset="utf-8" />
    <title>Section break: colour field</title>
    <style>
      html,
      body {
        margin: 0;
        background: #ffffff;
      }
      .slide {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f0f0f0;
        color: #2b2b2b;
        font-family: Arial, Helvetica, sans-serif;
      }
      .slide > * {
        position: absolute;
        margin: 0;
      }
      .k {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #5f5f5f;
      }
      .t {
        font-weight: 700;
        line-height: 1.05;
      }
      .lg {
        width: 240px;
        height: 60px;
        background: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPAAAAA8CAYAAABYfzddAAAAqElEQVR42u3dQQqAIBBAURVPOQeca+pWaCmE2XsnsOSji4ZKAQAAAAAAAAAAYE+NiHH6IjOz2ip4al4BCBgQMCBgEDAgYEDAgIBBwICAAQHDf/XbHugL33bDjnU2wAkMrtCAgAEBg4ABAQMCBgQMAgYEDAgYBAwIGBAwIGAQMHCu6wb6/QgNJzAgYEDAgIBBwICAAQGDgAEBAwIGBAwAAAAAAAAAAPCeCYTOCkmo3g3iAAAAAElFTkSuQmCC)
          left center/contain no-repeat;
      }
      .dark {
        background: #2b2b2b;
        color: #ededed;
      }
    </style>
  </head>
  <body>
    <div class="slide" data-template="section-colour-field">
      <div
        data-role="panel"
        data-need="colour-field:accent"
        style="left: 0; top: 0; width: 760px; height: 1080px; background: #4d4d4d"
      ></div>
      <div
        style="left: 120px; top: 300px; font-size: 200px; font-weight: 700; color: #e8e8e8; line-height: 1"
      >
        02
      </div>
      <div class="t" style="left: 120px; top: 560px; width: 560px; font-size: 72px; color: #f4f4f4">
        Duis aute irure dolor
      </div>
      <p style="left: 880px; top: 560px; width: 840px; font-size: 32px; line-height: 1.4">
        In reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur, excepteur sint
        occaecat.
      </p>
      <span class="lg" style="left: 1600px; top: 960px"></span>
    </div>
  </body>
</html>
